[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathogeniq"
version = "0.1.0"
description = "AI-powered pathogen biosurveillance from sequencing data"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "biopython>=1.83",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.0",
    "matplotlib>=3.8",
    "networkx>=3.2",
    "statsmodels>=0.14",
    "requests>=2.31",
    "tqdm>=4.66",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pyjwt>=2.8",
]

[project.scripts]
pathogeniq = "cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["pathogeniq*"]

[tool.setuptools]
py-modules = ["cli"]
